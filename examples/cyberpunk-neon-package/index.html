<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060812">
  <title>霓虹协议：校园终端挑战</title>
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <main class="terminal-shell">
    <header class="hero-panel cut-corners">
      <div class="system-line">
        <span class="live-dot"></span>
        <span>GRID ONLINE</span>
        <time id="system-clock">00:00:00</time>
      </div>
      <p class="eyebrow" id="event-eyebrow">NCPA // NEON GRID 2026</p>
      <h1 id="event-name" data-text="霓虹协议">霓虹协议</h1>
      <p class="subtitle" id="event-subtitle">连接校园节点，收集加密信标，完成你的霓虹身份认证。</p>
      <div class="event-meta">
        <span id="event-date">测试活动 · 18:00—21:00</span>
        <span>NODE // NCPA-01</span>
      </div>
    </header>

    <section class="status-grid" aria-label="活动进度">
      <article class="progress-module cut-corners">
        <div class="progress-ring" id="progress-ring" style="--progress: 0deg">
          <div><strong id="progress-value">0</strong><small>/ 9</small></div>
        </div>
        <div class="progress-copy">
          <span>PROTOCOL SYNC</span>
          <strong id="progress-percent">0%</strong>
          <p id="progress-message">等待第一枚信标接入</p>
        </div>
      </article>
      <article class="signal-module cut-corners">
        <span>SIGNAL</span>
        <div class="signal-bars" aria-label="信号良好"><i></i><i></i><i></i><i></i><i></i></div>
        <strong>STABLE</strong>
        <small>LATENCY 12MS</small>
      </article>
    </section>

    <button id="scan" class="scan-button cut-corners" type="button">
      <span class="scan-icon" aria-hidden="true"></span>
      <span><small>INITIATE SCAN</small><strong>扫描成就信标</strong></span>
      <b aria-hidden="true">›</b>
    </button>

    <div class="section-heading">
      <div><span>MISSION LOG</span><h2>节点任务</h2></div>
      <p><i></i> LIVE DATA</p>
    </div>
    <section id="achievement-groups" class="achievement-groups" aria-live="polite"></section>

    <footer>
      <span>NCPA NEON PROTOCOL // BUILD 1.0.0</span>
      <span>SECURE CHANNEL</span>
    </footer>
  </main>

  <template id="achievement-template">
    <article class="achievement-card cut-corners">
      <div class="card-index"></div>
      <div class="achievement-icon"></div>
      <div class="achievement-copy"><strong></strong><p></p></div>
      <span class="achievement-state"></span>
    </article>
  </template>

  <script src="/activity-package-sdk.js"></script>
  <script>
    const categoryMeta = [
      { id: "boot-sequence", code: "SECTOR_01", name: "启动序列" },
      { id: "signal-hunt", code: "SECTOR_02", name: "信号追踪" },
      { id: "core-access", code: "SECTOR_03", name: "核心权限" },
      { id: "", code: "SECTOR_00", name: "默认分类" },
    ];

    function setText(selector, value) {
      const element = document.querySelector(selector);
      if (element && value) element.textContent = value;
    }

    function renderAchievements(items) {
      const root = document.querySelector("#achievement-groups");
      const template = document.querySelector("#achievement-template");
      root.replaceChildren();

      const knownIds = new Set(categoryMeta.map((category) => category.id));
      const categories = [...categoryMeta];
      for (const item of items) {
        const categoryId = item.categoryId || "";
        if (!knownIds.has(categoryId)) {
          knownIds.add(categoryId);
          categories.push({ id: categoryId, code: "SECTOR_EXT", name: "扩展节点" });
        }
      }

      for (const category of categories) {
        const categoryItems = items.filter((item) => (item.categoryId || "") === category.id);
        if (!categoryItems.length) continue;

        const group = document.createElement("section");
        group.className = "achievement-group";
        const heading = document.createElement("div");
        heading.className = "group-heading";
        const label = document.createElement("span");
        const title = document.createElement("h3");
        const count = document.createElement("small");
        label.textContent = category.code;
        title.textContent = category.name;
        count.textContent = `${categoryItems.filter((item) => item.unlocked).length} / ${categoryItems.length}`;
        heading.append(label, title, count);

        const grid = document.createElement("div");
        grid.className = "achievement-grid";
        categoryItems.forEach((item, index) => {
          const card = template.content.firstElementChild.cloneNode(true);
          card.classList.toggle("is-unlocked", Boolean(item.unlocked));
          card.querySelector(".card-index").textContent = String(index + 1).padStart(2, "0");
          const icon = card.querySelector(".achievement-icon");
          if (item.unlocked && /^(data:image\/|\/uploads\/|https?:\/\/)/.test(item.icon || "")) {
            const image = document.createElement("img");
            image.src = item.icon;
            image.alt = "";
            icon.append(image);
          } else {
            icon.textContent = item.unlocked ? (item.icon || "◆") : "×";
          }
          card.querySelector(".achievement-copy strong").textContent = item.name;
          card.querySelector(".achievement-copy p").textContent = item.unlocked
            ? (item.description || "数据节点已解锁")
            : "加密数据 // 等待解锁";
          card.querySelector(".achievement-state").textContent = item.unlocked ? "SYNCED" : "LOCKED";
          grid.append(card);
        });

        group.append(heading, grid);
        root.append(group);
      }
    }

    function updateProgress(unlocked, total) {
      const safeTotal = Math.max(total, 1);
      const percent = Math.min(100, Math.round((unlocked / safeTotal) * 100));
      document.querySelector("#progress-ring").style.setProperty("--progress", `${percent * 3.6}deg`);
      setText("#progress-value", String(unlocked));
      setText("#progress-percent", `${percent}%`);
      document.querySelector("#progress-ring small").textContent = `/ ${total}`;
      setText("#progress-message", unlocked === total && total > 0
        ? "全部节点已同步 // 权限开放"
        : unlocked > 0 ? "数据同步进行中" : "等待第一枚信标接入");
    }

    function normalizeFallback(config) {
      return {
        event: config,
        achievements: config.achievements.map((item) => ({ ...item, unlocked: false })),
        progress: { unlocked: 0, total: config.achievements.length },
      };
    }

    async function getActivityContext() {
      if (window.NCPAActivity && window.parent !== window) {
        return window.NCPAActivity.getContext();
      }
      const response = await fetch("festival-config.json", { cache: "no-store" });
      if (!response.ok) throw new Error("无法读取活动配置");
      return normalizeFallback(await response.json());
    }

    async function start() {
      const context = await getActivityContext();
      setText("#event-name", context.event.name);
      setText("#event-eyebrow", context.event.eyebrow);
      setText("#event-subtitle", context.event.subtitle);
      setText("#event-date", context.event.dateLabel);
      document.querySelector("#event-name").dataset.text = context.event.name;
      updateProgress(context.progress.unlocked, context.progress.total);
      renderAchievements(context.achievements);
    }

    document.querySelector("#scan").addEventListener("click", async () => {
      const button = document.querySelector("#scan");
      if (!window.NCPAActivity || window.parent === window) {
        button.classList.add("is-demo");
        button.querySelector("strong").textContent = "预览模式：请在平台内测试";
        window.setTimeout(() => {
          button.classList.remove("is-demo");
          button.querySelector("strong").textContent = "扫描成就信标";
        }, 2200);
        return;
      }
      try {
        await window.NCPAActivity.openScanner();
      } catch (error) {
        console.error(error);
      }
    });

    function updateClock() {
      document.querySelector("#system-clock").textContent = new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
      }).format(new Date());
    }

    updateClock();
    window.setInterval(updateClock, 1000);
    start().catch((error) => {
      console.error(error);
      document.querySelector("#achievement-groups").innerHTML = '<p class="fatal-error">CONFIG ERROR // 活动配置加载失败</p>';
    });
  </script>
</body>
</html>
