<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>展示活动</title>
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <main>
    <header>
      <p>NCPA</p>
      <h1>展示活动</h1>
      <span>测试模式</span>
    </header>
    <section class="progress">
      <span>收集进度</span>
      <strong id="progress">0 / 6</strong>
    </section>
    <button id="scan" class="scan-button">打开二维码扫描器</button>
    <section>
      <h2>测试成就</h2>
      <div id="achievements" class="achievements"></div>
    </section>
  </main>
  <script src="/activity-package-sdk.js"></script>
  <script>
    const fallback = ["1", "2", "3", "4", "5", "6"];

    function renderAchievements(items) {
      const container = document.querySelector("#achievements");
      const cards = items.map((item) => {
        const card = document.createElement("article");
        const icon = document.createElement("b");
        const name = document.createElement("span");
        if (item.unlocked) card.className = "is-unlocked";
        if (item.unlocked && /^(data:image\/|\/uploads\/|https?:\/\/)/.test(item.icon)) {
          const image = document.createElement("img");
          image.src = item.icon;
          image.alt = "";
          icon.append(image);
        } else {
          icon.textContent = item.unlocked ? item.icon : "·";
        }
        name.textContent = item.name;
        card.append(icon, name);
        return card;
      });
      container.replaceChildren(...cards);
    }

    async function start() {
      if (!window.NCPAActivity || window.parent === window) {
        renderAchievements(fallback.map((name) => ({ name, icon: name, unlocked: false })));
        return;
      }
      const context = await window.NCPAActivity.getContext();
      document.querySelector("h1").textContent = context.event.name;
      document.querySelector("#progress").textContent = `${context.progress.unlocked} / ${context.progress.total}`;
      renderAchievements(context.achievements);
    }

    document.querySelector("#scan").addEventListener("click", () => {
      if (window.NCPAActivity && window.parent !== window) {
        window.NCPAActivity.openScanner().catch(console.error);
      }
    });

    start().catch(console.error);
  </script>
</body>
</html>
